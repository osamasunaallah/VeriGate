    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

</script>

<!-- Three.js via importmap, exposed as window globals for app.js
     (app.js is built from src/*.jsx, see README). -->

<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  window.THREE = THREE;
  window.GLTFLoader = GLTFLoader;
  window.RoomEnvironment = RoomEnvironment;
  window.__threeReady = true;
  window.dispatchEvent(new Event('threeready'));
</script>
</head>

  <div class="ambient"></div>
