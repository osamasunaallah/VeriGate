<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>VeriGate</title>
<meta name="description" content="VeriGate, an IoT receiving device: one tap, one verified shipment, one source of truth.">
<meta name="author" content="Osama Sunaallah">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">
<script>/* preload the 2 MB intro bird only when the intro will actually play (once per session) */
try{if(!sessionStorage.getItem('verigate_intro_played')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){var l=document.createElement('link');l.rel='preload';l.href='./phoenix-bird.glb?v=40';l.as='fetch';l.type='model/gltf-binary';l.crossOrigin='anonymous';document.head.appendChild(l)}}catch(e){}</script>
<link rel="preload" href="./verigate-logo.png?v=31" as="image">

<!-- Open Graph / social cards -->
<meta property="og:type" content="website">
<meta property="og:title" content="VeriGate">
<meta property="og:description" content="One tap. One verified shipment. One source of truth.">
<meta property="og:image" content="./process-thumbnail.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="kit.css?v=64">
<link rel="icon" type="image/png" href="./product-clean.jpg">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<!-- Three.js via importmap, exposed as window globals for app.js
     (app.js is built from src/*.jsx, see README). -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  window.THREE = THREE;
  window.GLTFLoader = GLTFLoader;
  window.RoomEnvironment = RoomEnvironment;
  window.__threeReady = true;
  window.dispatchEvent(new Event('threeready'));
</script>
</head>
<body>
  <div class="ambient"></div>
  <div id="root"></div>


  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="app.js?v=59"></script>
</body>
</html>
